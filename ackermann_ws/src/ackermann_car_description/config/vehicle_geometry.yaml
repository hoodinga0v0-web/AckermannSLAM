  cad_stop_gate: not_passed
  production_ready: false
  note: >-
    CAD source, export metadata, mass properties, and LiDAR ray datum were not
    supplied. Values marked here are an executable STL-derived fallback and
    must be replaced and regenerated before a production or real-vehicle use.

